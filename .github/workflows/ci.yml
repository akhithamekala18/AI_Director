# =============================================================================
# AI Director — CI Pipeline
# Runs on push to feature/day-1-foundation and on pull requests
# =============================================================================

name: CI

on:
  push:
    branches: [feature/day-1-foundation]
  pull_request:
    branches: [feature/day-1-foundation]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # --- Backend Tests --------------------------------------------------------
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_director_test
          POSTGRES_USER: ai_director_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_director_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Run Django check
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost
          DATABASE_URL: postgresql://ai_director_test:test_password@localhost:5432/ai_director_test
          REDIS_URL: redis://localhost:6379/0
          CREDENTIAL_ENCRYPTION_KEY: ci-test-fernet-key-not-for-production
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          cd backend
          python manage.py check --deploy 2>&1

      - name: Run security tests
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost
          DATABASE_URL: postgresql://ai_director_test:test_password@localhost:5432/ai_director_test
          REDIS_URL: redis://localhost:6379/0
          CREDENTIAL_ENCRYPTION_KEY: ci-test-fernet-key-not-for-production
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          cd backend
          python -m pytest tests/test_security*.py -v --tb=short 2>&1

      - name: Run guardrail tests
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost
          DATABASE_URL: postgresql://ai_director_test:test_password@localhost:5432/ai_director_test
          REDIS_URL: redis://localhost:6379/0
          CREDENTIAL_ENCRYPTION_KEY: ci-test-fernet-key-not-for-production
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          cd backend
          python -m pytest tests/test_guardrail.py -v --tb=short 2>&1

      - name: Run acceptance tests
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost
          DATABASE_URL: postgresql://ai_director_test:test_password@localhost:5432/ai_director_test
          REDIS_URL: redis://localhost:6379/0
          CREDENTIAL_ENCRYPTION_KEY: ci-test-fernet-key-not-for-production
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          cd backend
          python -m pytest tests/test_b3_acceptance.py -v --tb=short 2>&1

      - name: Check migration drift
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost
          DATABASE_URL: postgresql://ai_director_test:test_password@localhost:5432/ai_director_test
          REDIS_URL: redis://localhost:6379/0
          CREDENTIAL_ENCRYPTION_KEY: ci-test-fernet-key-not-for-production
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run 2>&1

      - name: Run full backend test suite
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_ALLOWED_HOSTS: localhost
          DATABASE_URL: postgresql://ai_director_test:test_password@localhost:5432/ai_director_test
          REDIS_URL: redis://localhost:6379/0
          CREDENTIAL_ENCRYPTION_KEY: ci-test-fernet-key-not-for-production
          DJANGO_SETTINGS_MODULE: config.settings.test
        timeout-minutes: 40
        run: |
          cd backend
          python -m pytest apps tests --tb=short 2>&1

  # --- Frontend Tests -------------------------------------------------------
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Lint
        run: |
          cd frontend
          npm run lint 2>&1

      - name: Build
        run: |
          cd frontend
          npm run build

  # --- Docker Build Test ----------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ai-director-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose
        env:
          POSTGRES_PASSWORD: ci-validation-password
        run: |
          cp backend/.env.example backend/.env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet 2>&1
