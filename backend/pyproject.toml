[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-director-backend"
version = "0.1.0"
description = "AI Director backend (Django/DRF) - Phase 1 foundation + Phase 2 AI orchestration"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0",
    "djangorestframework>=3.15",
    "psycopg2-binary>=2.9",
    "cryptography>=42",
    "httpx>=0.27",
    "celery>=5.4",
    "redis>=5.0",
    "django-celery-results>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["config"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["apps", "tests"]
addopts = "-q"
