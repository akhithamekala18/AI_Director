# =============================================================================
# AI Director — Docker Compose
# =============================================================================
# Usage:
#   docker compose up -d            Start all services
#   docker compose logs -f          Follow logs
#   docker compose down             Stop all services
#   docker compose exec backend python manage.py migrate
#   docker compose exec backend python manage.py createsuperuser
# =============================================================================
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_director
      POSTGRES_USER: ai_director
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_director"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://ai_director:${POSTGRES_PASSWORD:-changeme}@postgres:5432/ai_director
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l INFO --concurrency=4
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://ai_director:${POSTGRES_PASSWORD:-changeme}@postgres:5432/ai_director
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config beat -l INFO --scheduler django_celery_results.schedulers:DatabaseScheduler
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://ai_director:${POSTGRES_PASSWORD:-changeme}@postgres:5432/ai_director
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - static_data:/static:ro
      - media_data:/media:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  static_data:
