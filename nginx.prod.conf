# =============================================================================
# AI Director — Production Nginx Configuration (HTTPS template)
# SSL/TLS enabled, HTTP->HTTPS redirect, security headers
#
# This file is the HTTPS reference template. deploy/scripts/setup-ssl.sh
# substitutes the operator-supplied domain for the YOUR_DOMAIN placeholder and
# writes the result to ./certbot/conf/nginx-prod.conf, which is the config the
# frontend container is recreated with after a certificate is issued. Before
# the first certificate exists, the container runs the generated HTTP-only
# bootstrap config (./certbot/conf/nginx-bootstrap.conf) so the ACME webroot
# is reachable on port 80.
# =============================================================================

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

upstream backend {
    server backend:8000;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name _;

    # --- SSL Configuration (Let's Encrypt) -----------------------------------
    # The frontend service mounts ./certbot/conf read-only at /etc/letsencrypt,
    # so these paths correspond to the persisted Certbot storage
    # (./certbot/conf/live/<domain>/). setup-ssl.sh substitutes the
    # operator-supplied domain for the YOUR_DOMAIN placeholder at deploy time;
    # no real domain is hard-coded here. Never place a self-signed/fake
    # certificate at these paths.
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # --- Security Headers ----------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    # --- Request Size Limit --------------------------------------------------
    client_max_body_size 100M;

    # --- Static Files (collected by Django) ---------------------------------
    location /static/ {
        alias /static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Media Files (user uploads) -----------------------------------------
    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- API Proxy (rate limited) -------------------------------------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # --- Login endpoint (stricter rate limit) --------------------------------
    location /api/accounts/login/ {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Registration endpoint (rate limited) --------------------------------
    location /api/accounts/register/ {
        limit_req zone=login burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin ----------------------------------------------------------------
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend SPA (catch-all) -------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Don't cache index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # --- Health Check (for load balancer) ------------------------------------
    location /healthz {
    proxy_pass http://backend/api/core/healthz/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}
    # --- Deny access to hidden files ----------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

